    function startLoginBackdrop(){
      const page=document.getElementById('loginPage');

      const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const seen=[];
      let w=0,h=0,nodes=[],travelers=[],raf=0,last=0,dpr=1;
      function nextIp(){
        let ip,guard=0;
        do{
          ip=[11+Math.floor(Math.random()*210),Math.floor(Math.random()*256),Math.floor(Math.random()*256),1+Math.floor(Math.random()*254)].join('.');
          guard++;
        }while(seen.includes(ip)&&guard<12);

      }
      function lifeAlpha(t){
        if(t<0.14) return (t/0.14)*.4;
        if(t<0.4) return .4+.6*((t-0.14)/0.26);
        if(t<0.68) return 1;
        const f=(t-0.68)/0.32;

          x,y,z:Math.random(),
          vx:(Math.random()-.5)*0.000028,
          vy:(Math.random()-.5)*0.000024,
          vz:(Math.random()<.5?-1:1)*(0.00008+Math.random()*0.00016),
          born:now-(stagger?Math.random()*dur:0),
          dur, phase:Math.random()*Math.PI*2,

        const pts=[];
        let x=0.04+Math.random()*0.92, y=0.04+Math.random()*0.92, z=0.12+Math.random()*0.75;
        let ang=Math.random()*Math.PI*2;
        for(let i=0;i<4;i++){
          pts.push({x,y,z});
          ang+=(Math.random()-.5)*1.5;
          const step=0.18+Math.random()*0.26;
          x=Math.min(0.97,Math.max(0.03,x+Math.cos(ang)*step));
          y=Math.min(0.97,Math.max(0.03,y+Math.sin(ang)*step));
          z=Math.min(0.98,Math.max(0.06,z+(Math.random()-.42)*0.34));

      function build(now){
        const gap=74;

          for(let c=0;c<cols;c++){
            const x=Math.min(0.985,Math.max(0.015,(c+0.12+Math.random()*0.76)/cols));
            const y=Math.min(0.985,Math.max(0.015,(r+0.12+Math.random()*0.76)/rows));
            nodes.push(makeNode(x,y,now,true));
          }
        }
        travelers=[];
        const trips=Math.max(18,Math.round((w*h)/70000));

      function draw(now){

      if(tb.mode==='exclude')return [...sa].some(x=>!sb.has(x))||!sa.size;

    function binScopesOverlap(a,b){
      const ba=a||{},bb=b||{};
      if(!ba.mode||ba.mode==='all'||!bb.mode||bb.mode==='all')return true;
      if(ba.mode!=='include'||bb.mode!=='include')return true;
      const la=ba.list||[],lb=bb.list||[];
      if(la.some(x=>binListHit(x,lb)||binInRanges(x,bb.ranges)))return true;
      if(lb.some(x=>binInRanges(x,ba.ranges)))return true;
      return (ba.ranges||[]).some(r=>{const x=parseRange(r);return x&&(bb.ranges||[]).some(q=>{const y=parseRange(q);return y&&x.lo.length===y.lo.length&&x.lo<=y.hi&&y.lo<=x.hi})});
    }
    function windowsOverlap(a,b){return (!a.effectiveTo||!b.effectiveFrom||b.effectiveFrom<=a.effectiveTo)&&(!b.effectiveTo||!a.effectiveFrom||a.effectiveFrom<=b.effectiveTo)}
    function segmentsOverlap(a,b){
      const sa=a.scope||blankScope(),sb=b.scope||blankScope();
      return listOverlap(effChannels(sa),effChannels(sb))&&terminalsOverlap(sa.terminals,sb.terminals)&&listOverlap(sa.mccGroups,sb.mccGroups)&&binScopesOverlap(sa.bins,sb.bins)&&listOverlap(sa.schemes,sb.schemes)&&listOverlap(sa.issuerCountries,sb.issuerCountries)&&windowsOverlap(a,b);
    }
    function segmentClash(p,seg){return exceptionSegments(p).find(o=>o!==seg&&o.id!==seg.id&&segmentScore(o)===segmentScore(seg)&&(Number(o.priority)||0)===(Number(seg.priority)||0)&&segmentsOverlap(o,seg))||null}
    function validatePolicy(p,index){
      const issues=[];
      const add=(level,step,text)=>issues.push({level,step,text});
      if(!p.currency)add('error',1,'Select a currency.');
      else{
        if(!ruleCurrencyChoices().some(c=>c.alpha===p.currency))add('error',1,p.currency+' is not available for a Offer.');
        if(ruleRows.some((r,i)=>i!==index&&r.status!=='Archived'&&r.currency===p.currency))add('error',1,'A Offer for '+p.currency+' already exists.');
        const ccy=masterSpecs.Currency.rows.find(r=>r.alpha===p.currency);
        if(ccy&&ccy.enabled===false)add('warn',1,p.currency+' is disabled in the Currency master.');
        if(!binsForCurrency(p.currency).length)add('warn',1,'No live BINs are configured for '+p.currency+'.');
        if(fxRateFor(p.currency)==null)add('warn',1,'No FX rate is available for '+p.currency+'.');
      }
      if(!String(p.name||'').trim())add('error',1,'Offer name is required.');
      if(!p.effectiveFrom)add('error',1,'Effective from is required.');
      if(p.effectiveFrom&&p.effectiveTo&&p.effectiveTo<p.effectiveFrom)add('error',1,'Effective to is before Effective from.');
      binScopeIssues(p.cards&&p.cards.bins,'Card scope',1,add);
      const defs=(p.segments||[]).filter(s=>s.isDefault);
      if(defs.length!==1)add('error',2,'The Offer needs exactly one Default pricing segment.');
      if(defs[0])tierIssues(defs[0].tiers,'Default pricing',2,p,add);
      exceptionSegments(p).forEach(seg=>segmentIssues(seg,p,add));
      const ex=exceptionSegments(p);
      for(let i=0;i<ex.length;i++)for(let j=i+1;j<ex.length;j++){
        const a=ex[i],b=ex[j];
        if(segmentScore(a)===segmentScore(b)&&(Number(a.priority)||0)===(Number(b.priority)||0)&&segmentsOverlap(a,b))add('error',3,'Exceptions "'+a.name+'" and "'+b.name+'" overlap. Narrow one of them.');
      }
      return issues;
    }
    function policyHealth(p){
      const items=[];
      let level='ok';
      const bad=t=>{items.push(t);level='bad'};
      const warn=t=>{items.push(t);if(level==='ok')level='warn'};
      if(!p)return {level:'ok',items};
      const today=isoToday(),soon=isoPlusDays(today,30);
      const ccy=masterSpecs.Currency.rows.find(r=>r.alpha===p.currency);
      if(!ccy||ccy.enabled===false)bad(p.currency+' is disabled in the Currency master.');
      if(!binsForCurrency(p.currency).length)bad('No live BINs use '+p.currency+'.');
      if(fxRateFor(p.currency)==null)bad('No FX rate for '+p.currency+'.');
      if(p.effectiveTo&&p.effectiveTo<today)warn('The Offer ended on '+displayDate(p.effectiveTo)+'.');
      const seen=new Set();
      policyCharges(p).forEach(([kind,id,where])=>{
        const key=kind+id;
        if(seen.has(key))return;
        seen.add(key);
        const c=chargeInfo(kind,id);
        if(!c)bad(where+': a charge no longer exists.');
        else if(c.status!=='Effective')bad(c.text+' ('+where+') is '+c.status+'.');
        else if(c.to&&c.to<today)bad(c.text+' ('+where+') expired on '+displayDate(c.to)+'.');
        else if(c.to&&c.to<=soon)warn(c.text+' ('+where+') expires on '+displayDate(c.to)+'.');
      });
      exceptionSegments(p).forEach(seg=>{
        const s=seg.scope||{},t=s.terminals||{};
        (t.atms||[]).forEach(id=>{const a=masterSpecs.ATM.rows.find(x=>x.id===id);if(!a||a.status!=='Active')warn(seg.name+': ATM '+id+' is inactive.')});
        (t.groups||[]).forEach(code=>{if(!selectableGroups().some(g=>g.code===code))warn(seg.name+': ATM group '+groupName(code)+' is not available.')});
        (s.mccGroups||[]).forEach(name=>{const g=(masterSpecs['MCC Grouping'].rows||[]).find(x=>x.name===name);if(!g||g.disabled)warn(seg.name+': MCC group '+name+' is disabled or missing.')});
      });
      return {level,items};
    }

      return keys.map(k=>({label:(mb.get(k)||ma.get(k)).label,before:ma.has(k)?ma.get(k).value:'',after:mb.has(k)?mb.get(k).value:''})).filter(x=>x.before!==x.after);

      }

    function quoteTraffic(){
      const rows=Array.isArray(quotes)?quotes:[];
      const volume=rows.length;
      const FALL=['NOT_OFFERED','CANCELLED','NO_SELECTION','EXPIRED'];
      const fallColors={NOT_OFFERED:'#e9a52c',CANCELLED:'#728096',NO_SELECTION:'#c56b3a',EXPIRED:'#5b6ee1'};
      const fallSet=new Set(FALL);
      const fallParts=FALL.map(status=>({status,val:rows.filter(q=>q.status===status).length,color:fallColors[status]}));
      const fall=fallParts.reduce((n,p)=>n+p.val,0);
      const dcc=rows.filter(q=>q.option==='OPT1'&&!fallSet.has(q.status)).length;
      const local=rows.filter(q=>q.option==='OPT2'&&!fallSet.has(q.status)).length;
      const other=Math.max(0,volume-dcc-local-fall);
      const offered=rows.filter(q=>q.status!=='NOT_OFFERED').length;
      const completed=rows.filter(q=>q.option==='OPT1'&&(q.status==='COMPLETED'||(q.cycle||[]).some(s=>s.status==='COMPLETED'))).length;
      const optIn=offered?Math.round(completed/offered*1000)/10:0;
      const commission=Math.round(rows.reduce((s,q)=>s+(Number(q.commission)||0),0)*100)/100;
      const width=n=>volume?Math.round(n/volume*100):0;
      return {volume,dcc,local,fall,fallParts,other,offered,completed,optIn,commission,width};
    }
    let istLastCallAt=0,dashLiveTimer=0;
    function parseStamp(s){
      const m=String(s||'').match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4}),\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if(!m) return 0;
      const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
      const mo=months[m[2]]; if(mo==null) return 0;
      const t=new Date(Number(m[3]),mo,Number(m[1]),Number(m[4]),Number(m[5]),Number(m[6]||0)).getTime();
      return Number.isFinite(t)?t:0;
    }
    function markIstCall(){istLastCallAt=Date.now()}
    function quoteStampMs(q){
      let t=parseStamp(q&&q.time);

      return t;

    function quoteCurrency(q){
      const c=String(q&&q.currency||'').toUpperCase();
      if(/^[A-Z]{3}$/.test(c)) return c;
      const a=String(q&&q.amount||'').match(/^([A-Z]{3})\b/);

    function polarXY(cx,cy,r,deg){
      const a=deg*Math.PI/180;
      return [+(cx+r*Math.cos(a)).toFixed(3),+(cy+r*Math.sin(a)).toFixed(3)];
    }
    function donutSlice(cx,cy,R,r,a1,a2){
      const sweep=a2-a1;
      if(sweep>=359.99) return `M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx-0.01} ${cy-R} L ${cx-0.01} ${cy-r} A ${r} ${r} 0 1 0 ${cx} ${cy-r} Z`;
      const large=sweep>180?1:0;
      const [x1,y1]=polarXY(cx,cy,R,a1),[x2,y2]=polarXY(cx,cy,R,a2);
      const [x3,y3]=polarXY(cx,cy,r,a2),[x4,y4]=polarXY(cx,cy,r,a1);
      return `M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${r} ${r} 0 ${large} 0 ${x4} ${y4} Z`;
    }
    function fxRateMix(){
      const colors={USD:'#3273c8',EUR:'#e8492f',GBP:'#18a875',AED:'#e9a52c',JPY:'#6b5ce7',CHF:'#1f3a5f',SAR:'#7d94b0'};
      const srcColors={'Bank Treasury':'#3273c8',Bloomberg:'#e8492f',Reuters:'#18a875'};
      const local=baseAlpha();
      const counts={};
      (Array.isArray(quotes)?quotes:[]).forEach(q=>{
        const c=quoteCurrency(q);
        if(!c||c===local) return;
        counts[c]=(counts[c]||0)+1;
      });
      let slices=Object.keys(counts).map(ccy=>{
        const rate=(typeof fxRateList!=='undefined'?fxRateList:[]).find(r=>r.ccy===ccy);
        return {key:ccy,value:counts[ccy],rate:rate?rate.rate:'',source:rate?rate.source:'',color:colors[ccy]||'#7d94b0'};
      }).sort((a,b)=>b.value-a.value);
      let mode='quotes';
      if(!slices.length){
        mode='source';
        const src={};
        (typeof fxRateList!=='undefined'?fxRateList:[]).forEach(r=>{src[r.source||'Unknown']=(src[r.source||'Unknown']||0)+1});
        slices=Object.keys(src).map(s=>({key:s,value:src[s],rate:'',source:s,color:srcColors[s]||'#7d94b0'}));
      }
      const total=slices.reduce((n,s)=>n+s.value,0);
      const top=slices[0];
      const caption=mode==='quotes'?'quote mix by currency':'live rates by source';
      const insight=mode==='quotes'&&top&&total
        ? top.key+' is '+Math.round(top.value/total*100)+'% of FX quotes — keep this rate fresh.'
        : (slices.length?slices.map(s=>s.key+' '+s.value).join(' · ')+'.':'No live FX rates yet.');
      return {mode,total,slices,caption,insight};

    function toIsoDate(value){
      const s=String(value==null?'':value).trim();
      if(!s) return '';
      if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const months={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
      const named=s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/);
      if(named){
        const mm=months[named[2].slice(0,3).toLowerCase()];
        if(mm) return named[3]+'-'+mm+'-'+String(Number(named[1])).padStart(2,'0');
      }
      const slash=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if(slash) return slash[3]+'-'+String(Number(slash[2])).padStart(2,'0')+'-'+String(Number(slash[1])).padStart(2,'0');
      return '';
    }

        if(!Number.isFinite(lng)||lng<-180||lng>180){toast('Longitude must be between -180 and 180');return}

      if(dup>=0){const field=spec.fields.find(f=>f.key===spec.unique);toast(currentScreen==='Division'?'Division already exists for this department':Array.isArray(spec.unique)?'City already exists for this country':(field?field.label:currentScreen==='MCC Code Configuration'?'MCC Range':spec.singular)+' already exists');return}

      if(currentScreen==='Currency'&&data.base&&masterGoesToChecker()){data._baseRequested=true;data.base=false}
      else if(currentScreen==='Currency'&&data.base) spec.rows.forEach((r,i)=>{if(i!==masterIndex) r.base=false});
      const user=currentUser?currentUser.username:'iris.admin';
      const queueMaster=masterGoesToChecker();

          masterSpecs.City.rows.forEach(c=>{if(c.country===prev.name)c.country=data.name});

        if(currentScreen==='Division'&&(prev.name!==data.name||prev.department!==data.department))portalUsers.forEach(u=>{if(u.division===prev.name&&u.department===prev.department){u.division=data.name;u.department=data.department}});
        if(ORG_USER_FIELD[currentScreen]&&currentScreen!=='Division'&&prev.name!==data.name){const key=ORG_USER_FIELD[currentScreen];portalUsers.forEach(u=>{if(u[key]===prev.name)u[key]=data.name})}
        if(currentScreen==='Rate Source'&&prev.name!==data.name){

        }

    function upsertPeerApproval(proposal,userKey,maker){
      const change=proposal.role+' '+proposal.fullName+' ('+proposal.username+')';
      const existing=approvals.find(a=>a.peer&&a.status==='Pending'&&(a.userKey===userKey||a.userKey===proposal.username));
      if(existing){
        existing.change=change;
        existing.proposal=proposal;
        existing.submitted=nowStamp();
        existing.userKey=userKey;
        existing.maker=maker||existing.maker;
        return;
      }
      approvals.unshift({id:nextAprId(),module:'Users & Roles',entityType:'User',entityId:proposal.username,entityName:proposal.fullName||proposal.username,maker:maker,makerName:actorOf(maker).name,submitted:new Date().toISOString(),change,status:'Pending',comment:'',checker:'',correlationId:newCorrelation(),peer:true,userKey,proposal});
    }
    function finishPeerUser(item,approved){
      const key=item.userKey||(item.proposal&&item.proposal.username)||'';
      const idx=portalUsers.findIndex(u=>u.username===key);
      const live=idx>=0?portalUsers[idx]:null;
      const source=item.proposal&&item.proposal.username?item.proposal:live;
      if(!source) return;
      if(!approved){
        if(live){
          live.status='Rejected';
          if(live.password&&accounts[live.username]&&accounts[live.username].password===live.password) delete accounts[live.username];
        }
        syncPortalAccounts();
        return;
      }
      const next=blankPortalUser(Object.assign({},live||{},source,{status:'Active',createdBy:item.maker||source.createdBy||''}));
      if(!next.password&&live&&live.password) next.password=live.password;
      if(live&&live.lastLogin) next.lastLogin=live.lastLogin;
      if(live&&live.username&&live.username!==next.username) delete accounts[live.username];
      if(idx>=0) portalUsers[idx]=next;
      else portalUsers.push(next);
      syncPortalAccounts();
    }

    function normalizeAudits(){

    function collectJsonFields(value){
      const out=[];
      const walk=(node,prefix)=>{
        if(Array.isArray(node)){
          if(node.length&&node[0]&&typeof node[0]==='object')walk(node[0],prefix?prefix+'[]':'');
          else if(prefix)out.push(prefix);
          return;
        }
        if(node&&typeof node==='object'){
          const keys=Object.keys(node);
          if(!keys.length){if(prefix)out.push(prefix);return}
          keys.forEach(k=>walk(node[k],prefix?prefix+'.'+k:k));
          return;
        }
        if(prefix)out.push(prefix);
      };
      walk(value,'');
      return [...new Set(out)];
    }

        if(status==='Approved'&&item.maker===me){toast('You cannot approve a user you created. Another admin has to approve it.');return}

    function flushStore(){
      if(flushing){flushAgain=true;return Promise.resolve()}
      const parts=collectionParts();
      const changed=Object.keys(parts).filter(file=>JSON.stringify(parts[file])!==lastParts[file]);
      if(!changed.length) return Promise.resolve();
      const previous={};
      changed.forEach(file=>{previous[file]=lastParts[file];lastParts[file]=JSON.stringify(parts[file])});
      flushing=true;
      let chain=writeCollection(changed[0],parts[changed[0]]);
      for(let i=1;i<changed.length;i++){
        const file=changed[i];
        chain=chain.then(()=>writeCollection(file,parts[file]));
      }
      return chain.then(meta=>{
        if(meta&&meta.files){
          changed.forEach(file=>{if(meta.files[file]!=null) seenFileRev[file]=meta.files[file]});
          storeRevision=meta.revision||storeRevision;
        }
        lastSnapshot=JSON.stringify(snapshotState());
      }).catch(err=>{
        changed.forEach(file=>{if(previous[file]===undefined) delete lastParts[file]; else lastParts[file]=previous[file]});
        throw err;
      }).finally(()=>{
        flushing=false;
        if(flushAgain){flushAgain=false;persistStore()}

    async function applyRemote(meta){

      if(!pendingNames.length){storeRevision=meta.revision||storeRevision;return}
      applyingRemote=true;
      try{
        const files=meta.files||{};
        const names=pendingNames;
        const snap=snapshotState();
        for(let i=0;i<names.length;i++){
          const file=names[i];
          const data=await readData(file);
          const spec=DATA_FILES[file];
          if(!Array.isArray(data)) continue;
          if(spec.master) snap.masters[spec.master]=data;
          else snap[spec.key]=data;
        }
        applySnapshot(snap);
        storeRevision=meta.revision;
        seenFileRev=Object.assign({},files);

      }finally{
        applyingRemote=false;

    function parseCsv(text){

      for(let i=0;i<s.length;i++){

        if(q){
          if(c==='"'){if(s[i+1]==='"'){cur+='"';i++}else q=false}
          else cur+=c;
        }else if(c==='"') q=true;
        else if(c===delim){row.push(cur);cur=''}

    async function unzip(buf){

      if(view.getUint32(eocd+16,true)===0xFFFFFFFF) throw new Error('This Excel file is too large to import. Save it again as .xlsx.');
      const count=view.getUint16(eocd+10,true);
      let offset=view.getUint32(eocd+16,true);
      const files={};
      for(let n=0;n<count;n++){
        if(offset+46>bytes.length||view.getUint32(offset,true)!==0x02014b50) throw new Error('This file is not a valid Excel workbook.');
        const method=view.getUint16(offset+10,true);
        const compSize=view.getUint32(offset+20,true);
        const nameLen=view.getUint16(offset+28,true);
        const extraLen=view.getUint16(offset+30,true);
        const commentLen=view.getUint16(offset+32,true);
        const localOff=view.getUint32(offset+42,true);
        const name=new TextDecoder().decode(bytes.subarray(offset+46,offset+46+nameLen)).replace(/\\/g,'/');

        if(view.getUint32(localOff,true)!==0x04034b50) throw new Error('This file is not a valid Excel workbook.');
        const localNameLen=view.getUint16(localOff+26,true);
        const localExtraLen=view.getUint16(localOff+28,true);
        const dataStart=localOff+30+localNameLen+localExtraLen;
        if(compSize>25000000||dataStart+compSize>bytes.length) throw new Error('The Excel file is too large to import.');
        const comp=bytes.slice(dataStart,dataStart+compSize);

      if(!file){setImportMsg('Choose an Excel or CSV file.');return}
      const btn=document.querySelector('#overlay .modal-foot .primary');
      if(btn) btn.disabled=true;
      try{
        const matrix=await readSpreadsheet(file);
        if(!matrix.length){setImportMsg('The file is empty.');return}
        const picked=pickTable(matrix,pack.fields);
        if(!picked.score){
          setImportMsg('No headers matched the fields. Headers are compared in lowercase. Found: '+(picked.headers.filter(h=>normHead(h)).join(', ')||'none')+'.');
          return;
        }
        const missing=pack.fields.filter(f=>f.required&&!picked.mapping.some(m=>m&&m.key===f.key));
        if(missing.length){
          setImportMsg('Required columns were not found: '+missing.map(f=>f.label).join(', ')+'. Headers are matched in lowercase to the field name.');
          return;
        }
        const records=buildRecords(matrix,picked);
        if(!records.length){setImportMsg('No data rows were found under the header.');return}
        const result=commitImport(pack,records);
        const rejected=result.rejected||[];
        if(!result.added&&!result.updated&&!rejected.length){
          setImportMsg('Nothing was imported. '+result.skipped+' row'+(result.skipped===1?' was':'s were')+' skipped because a required value was empty.');
          return;
        }
        const parts=[];
        if(result.added||result.updated||result.skipped) parts.push(result.added+' added',result.updated+' updated');
        if(result.skipped) parts.push(result.skipped+' skipped');
        if(rejected.length) parts.push(rejected.length+' not imported');
        const unmatched=unmatchedHeaders(picked.headers,picked.mapping);
        let msg=parts.join(', ')+'.';
        if(pack.kind==='bin'&&(result.added||result.updated)) msg+=' Listed as Pending and sent for checker approval.';
        if(unmatched.length) msg+=' Unmatched headers: '+unmatched.join(', ')+'.';
        pushAudit('IMPORT',currentScreen,rejected.length&&!result.added&&!result.updated?'Failure':'Success','Excel import on '+pack.title+': '+msg,null,{file:file.name,added:result.added,updated:result.updated,skipped:result.skipped,rejected:rejected.length});
        if(result.added||result.updated) persistStore();
        closeOverlay();
        if(result.added||result.updated) renderScreen();
        toast(pack.title+' import: '+msg);
        if(rejected.length) showRejectedImport(pack,rejected);
      }catch(err){
        setImportMsg(err&&err.message?err.message:'The file could not be read.');
      }finally{
        const again=document.querySelector('#overlay .modal-foot .primary');
        if(again) again.disabled=false;
      }
    }
    document.addEventListener('click',e=>{const menu=document.getElementById('alertMenu');if(menu&&!menu.contains(e.target))closeAlertMenu()});
    document.addEventListener('click',e=>{
      if(!document.body.classList.contains('checker-viewing')) return;
      const root=checkerViewRoot();
      if(!root||!root.contains(e.target)) return;
      if(e.target.closest('.pager,.tabs,.wf-toggle,.wf-slot,.search-field,.th-label,.col-pop')) return;
      const btn=e.target.closest('button');
      if(btn&&(btn.classList.contains('close')||btn.classList.contains('rule-collapse')||btn.classList.contains('tab'))) return;
      if(btn){const t=(btn.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();if(t==='view'||t==='close'||t==='cancel') return}
      if(e.target.closest('input,select,textarea,button,.atm-ms-trigger,.atm-ms-option,.atm-ms-chip,.map-chip,.map-drop,.check-line')){e.preventDefault();e.stopPropagation()}
    },true);
    function runLocalRepairs(){
      masterSpecs.Division.rows.forEach(d=>{if(d.department)return;const known={'Treasury Services':'DCC Operations',Channels:'ATM Operations',Compliance:'Audit'};if(known[d.name])d.department=known[d.name]});
      try{if(sessionStorage.getItem('iris-dcc-manager-v')!=='1'){portalUsers.forEach(u=>{if(u&&(u.username==='iris.admin'||u.username==='dcc.admin'))u.isManager=true});sessionStorage.setItem('iris-dcc-manager-v','1')}}catch(e){}
      try{if(sessionStorage.getItem('iris-dcc-mcc-list-v')!=='3'){masterSpecs['MCC Code Configuration'].rows=[];sessionStorage.setItem('iris-dcc-mcc-list-v','3')}}catch(e){}
      try{if(sessionStorage.getItem('iris-dcc-mcc-group-v')!=='1'){masterSpecs['MCC Grouping'].rows=[];sessionStorage.setItem('iris-dcc-mcc-group-v','1')}}catch(e){}
      ensureBaseCurrency();
      ensureSingleRateSource();
      migrateCountryNegList();
      migrateRulePolicies();
      normalizePendingWords();
      normalizeAudits();
      ensureApprovals();
      syncPortalAccounts();
      try{sessionStorage.removeItem('iris-dcc-audit-v')}catch(e){}
      syncActivityLog();
    }
    async function bootSharedStore(){
      let loaded=false;
      try{loaded=await loadSharedStore()}catch(e){loaded=false}
      if(!loaded){
        runLocalRepairs();
        try{await flushStore()}catch(e){}
      }
      watchStore(['saveMaster','deleteMaster','saveBin','deleteBin','moveProvider','saveProviderRule','refreshRateFeed','saveDraft','settleApproval','saveRateSource','switchFxTab','confirmSubmitRule','deleteRule','toggleMaster','toggleListedRow','toggleBin','toggleRule','toggleUser','deleteUser','savePortalUser','toggleNetwork','acceptBaseChange']);
      storeReady=true;
      resumeSession();
      setInterval(()=>{pollSharedStore().catch(()=>{})},3000);
    }
    bootSharedStore();
  </script>
