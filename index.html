<body>
  <section id="loginPage" class="login-page">
    <div class="login-card">
      <div class="logo">IRIS <span>●</span></div>
      <h1>DCC Operations Portal</h1>
      <div id="loginError" class="login-error hidden"></div>
      <form id="loginForm">
        <div class="field"><label>Username</label><div class="input-icon"><b>♙</b><input id="username" autocomplete="username" required placeholder="Enter your username"></div></div>
        <div class="field"><label>Password</label><div class="input-icon"><b>⚿</b><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button type="button" class="password-eye" onclick="togglePassword()">◉</button></div></div>
        <button class="login-btn" type="submit">Login</button>
      </form>
      <div class="login-help"><a href="#" onclick="toast('Password reset is available through the bank identity provider in production.');return false">Forgot password?</a></div>
      <div class="demo-accounts"><b>Prototype access</b><br>Admin: iris.admin / Admin@IRIS2026<br>Maker: dcc.maker / Maker@IRIS2026<br>Checker: dcc.checker / Check@IRIS2026<br>Viewer: atm.ops / Viewer@IRIS2026</div>
    </div>
  </section>
  <div id="app" class="app hidden">
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()">☰</button><div class="logo">IRIS <span>●</span></div>
      <div class="quick-actions"><button class="quick" onclick="navigate('Alerts')">♢<i class="dot"></i></button><button class="quick" onclick="toast('Help centre opened')">?</button><button class="quick" onclick="toast('Guided tour: start with Dashboard KPIs')">▶</button><button class="quick" onclick="toast('IRIS DCC v1.0 • ATM Channel')">i</button></div>
      <div class="smart-nav">⌕ <input id="smartSearch" placeholder="Smart Navigation" oninput="smartNav(this.value)"></div>
      <div class="user-menu" onclick="toggleUserMenu()"><div class="avatar" id="avatar">IA</div><div class="user-copy"><b id="userName">Iris Admin</b><span id="userRole">Administrator</span></div><span class="chevron">⌄</span>
        <div id="userDropdown" class="user-dropdown hidden"><button onclick="navigate('Profile')">Profile</button><button onclick="toast('Change Password opened')">Change Password</button><button onclick="logout()">Logout</button></div>
      </div>
    </header>
    <div class="layout"><aside id="sidebar" class="sidebar"><nav id="nav" class="nav-scroll"></nav></aside><main class="content"><div id="breadcrumb" class="breadcrumb"></div><div id="screen" class="canvas"></div></main></div>
  </div>
  <div id="overlay"></div>
  <script>
    const accounts={
      'iris.admin':{password:'Admin@IRIS2026',name:'Iris Admin',role:'Administrator',short:'Admin'},
      'dcc.maker':{password:'Maker@IRIS2026',name:'DCC Maker',role:'Maker',short:'Maker'},
      'dcc.checker':{password:'Check@IRIS2026',name:'DCC Checker',role:'Checker',short:'Checker'},
      'atm.ops':{password:'Viewer@IRIS2026',name:'ATM Operations',role:'Viewer',short:'Viewer'},
      'dcc.audit':{password:'Audit@IRIS2026',name:'DCC Audit',role:'Auditor',short:'Auditor'},
      'dcc.finance':{password:'Finance@IRIS2026',name:'DCC Finance',role:'Finance',short:'Finance'}
    };
    let currentUser=null,currentScreen='Dashboard',sidebarCollapsed=false,selectedQuote=null,atmStep=1,atmOption=null,networkFormIndex;
    const permissions={
      Administrator:['Dashboard','Payment Networks','Currency','Fee Profile','BIN Exclusions','ATM Groups','Blocking Profiles','FX Rates','Quotes Monitor','EOD & Settlement','Reconciliation','Reports','Users & Roles','Audit Log','Alerts','ATM Simulator'],
      Maker:['Dashboard','Payment Networks','Currency','Fee Profile','BIN Exclusions','ATM Groups','Blocking Profiles','FX Rates','Quotes Monitor','Reports','ATM Simulator'],
      Checker:['Dashboard','Payment Networks','Currency','Fee Profile','BIN Exclusions','ATM Groups','Blocking Profiles','FX Rates','Quotes Monitor','Reports','Users & Roles','Audit Log','ATM Simulator'],
      Viewer:['Dashboard','ATM Groups','Quotes Monitor','Reports','Alerts','ATM Simulator'],

     function configFields(kind){const fields={Currency:[['ISO Code *','text','',['682','840','978']],['Alpha Code *','text',''],['Currency Name *','text',''],['Decimal Places','number','2'],['Rounding Rule','select','',['Half-up','Half-even','Down']],['Enabled','check',true]],'Fee Profile':[ ['Tier Name *','text',''],['Currency *','select','',['SAR - 682','USD - 840','EUR - 978']],['Scheme','select','',['VISA','MASTERCARD','ANY']],['BIN Range','text',''],['ATM Group','select','',['All ATM groups','Riyadh Pilot Group','Jeddah Fleet']],['Markup % *','number','3.50'],['Access Fee Amount','number','23.00'],['Tax Rate %','number','15.00'],['Effective From','date','2026-09-01'],['Effective To','date',''],['Tax Inclusive','check',true]],'BIN Exclusions':[ ['BIN Start *','text',''],['BIN End *','text',''],['Scheme *','select','',['VISA','MASTERCARD','DOMESTIC','REGIONAL']],['Issuer Country','select','',['Saudi Arabia','Pakistan','United Arab Emirates','Any']],['Reason Code *','select','',['BIN_EXCLUDED','CCY_DISABLED','GROUP_DISABLED','SCHEME_OPTOUT']],['Effective From','date','2026-09-01'],['Status','select','',['Draft','Effective','Disabled']]],'ATM Groups':[ ['Group Code','text','ATM-GRP-NEW'],['Group Name *','text',''],['Region *','select','',['Central','West','East','North']],['Member ATM IDs','text',''],['DCC Enabled','check',true],['Pilot Group','check',false]],'Blocking Profiles':[ ['Profile Code','text','BLK-NEW'],['Profile Name *','text',''],['Scope Type *','select','',['BIN range','Scheme','ATM Group','Country']],['Block Type *','select','',['Block DCC only','Block transaction']],['Reason Code *','select','',['BIN_EXCLUDED','SCHEME_OPTOUT','GROUP_DISABLED','CCY_DISABLED']],['Effective From','date','2026-09-01'],['Effective To','date',''],['Emergency activation','check',false]],'FX Rates':[ ['Currency Pair *','select','',['SAR / USD','SAR / EUR','SAR / GBP','SAR / AED']],['Rate Value *','number','0.2740'],['Refresh Interval (sec)','number','60'],['TTL (sec)','num     function approveChange(btn){btn.parentElement.parentElement.style.opacity='.45';btn.parentElement.innerHTML='<span class="status green">Approved</span>';toast('Change approved and moved to Effective')}
    function rejectChange(btn){btn.parentElement.parentElement.style.opacity='.45';btn.parentElement.innerHTML='<span class="status red">Rejected</span>';toast('Change rejected with a mandatory comment recorded')}
    function ackAlert(btn){btn.textContent='Acknowledged';btn.disabled=true;btn.classList.remove('primary');btn.classList.add('secondary');toast('Alert acknowledged and timestamped')}
    function smartNav(v){if(!v){document.getElementById('smartResults')?.remove();return}const hits=permissions[currentUser.role].filter(x=>x.toLowerCase().includes(v.toLowerCase()));let box=document.getElementById('smartResults');if(!box){box=document.createElement('div');box.id='smartResults';box.style='position:fixed;top:58px;right:180px;width:290px;background:#fff;border:1px solid #dce2ea;box-shadow:0 10px 25px rgba(0,0,0,.16);z-index:20;border-radius:3px;overflow:hidden';document.body.appendChild(box)}box.innerHTML=hits.length?hits.map(x=>`<button style="display:block;width:100%;padding:10px 13px;text-align:left;background:#fff;border:0;border-bottom:1px solid #edf0f4;font-size:12px;color:#263449" onclick="document.getElementById('smartResults').remove();navigate('${x}')">${x}</button>`).join(''):'<div style="padding:12px;font-size:12px;color:#728096">No matching screens</div>'}
    function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2900)}
  </script>
</body>
</html>
