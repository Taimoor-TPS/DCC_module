    function openAtmMenu(){

        const stops=[...menu.querySelectorAll('input,button')];

    function syncRateProviders(){

    function providerChain(){

      let name=rateProviders[0].name;
      while(name&&!seen.has(name)){seen.add(name);parts.push(name);const row=rateProviders.find(p=>p.name===name);name=row?row.fallback:''}

     function quoteFigures(){
       const sar=atmAmount, rate=0.2740, markupPct=3.5, feePct=0.40, vatPct=15;
       const base=Math.round(sar*rate*100)/100;

       const fee=Math.round(base*feePct/100*100)/100;
       const vat=Math.round((markup+fee)*vatPct/100*100)/100;
       const usd=Math.round((base+markup+fee+vat)*100)/100;

    function displayDate(iso){if(!iso)return '—';const [y,m,d]=iso.split('-'),months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${d} ${months[Number(m)-1]} ${y}`}
    function saveDraft(module){
      if(module==='Markup'){
        const type=document.getElementById('markupType').value;
        const amount=document.getElementById(type==='Percentage'?'markupPercent':'markupValue').value;
        if(amount===''){toast((type==='Percentage'?'Percentage':'Value')+' is required');return}
        const markup=type==='Percentage'?Number(amount).toFixed(2)+'%':amount;
        const from=displayDate(document.getElementById('markupFrom').value);
        const to=document.getElementById('markupNoExpiry').checked?'No expiry':displayDate(document.getElementById('markupTo').value);
        const rule=[type,markup,from,to,'Draft'];
        const maker=currentUser?currentUser.username:'dcc.maker';
        const change=type+' • '+markup;
        const id='MKP-'+String(Date.now()).slice(-6);
        markupRules.unshift(rule);
        approvals.unshift({id,module:'Markup',maker,submitted:nowStamp(),change,status:'Pending',rule});
        pushAudit('CREATE','Markup','Success','Markup rule submitted for checker approval: '+change,null,{type,markup,effectiveFrom:from,effectiveTo:to,status:'Draft',maker});
        closeOverlay();
        if(currentScreen==='Markup')renderScreen();
        toast('Markup saved as Draft, sent to the checker, and written to the audit log');
        return;
      }
      if(module==='Negative Lists'){
        const list=document.getElementById('negList').value;
        const value=document.getElementById('negValue').value.trim();
        if(!value){toast((list==='Currency'?'Currency':'BIN')+' is required');return}
        const to=document.getElementById('negNoExpiry').checked?'No expiry':displayDate(document.getElementById('negTo').value);
        const reason=document.getElementById('negReason').value;
        if(list==='BIN'){negBinRows.unshift([value,document.getElementById('negScheme').value,'—',reason,to,'Draft']);negTab='negBin'}
        else{const row=masterSpecs.Currency.rows.find(r=>r.alpha===value);negCcyRows.unshift([row?row.name:value,value,reason,currentUser?currentUser.username:'dcc.maker',to,'Draft']);negTab='negCcy'}
        closeOverlay();
        if(currentScreen==='Negative Lists')renderScreen();
        toast('Negative list entry saved as Draft and routed to Checker');
        return;
      }
      if(module==='Fees'){
        const name=document.getElementById('feeName').value.trim();
        if(!name){toast('Fee Name is required');return}
        const structure=document.getElementById('feeStructure').value;
        const flat=document.getElementById('feeFlat').value;
        const pct=document.getElementById('feePercent').value;
        if(structure!=='Percentage'&&flat===''){toast('Flat amount is required');return}
        if(structure!=='Flat fee'&&pct===''){toast('Percentage is required');return}
        feeRules.unshift([name,structure,feeValue(structure,flat,pct),'Draft']);
        closeOverlay();
        if(currentScreen==='Fees')renderScreen();
        toast('DCC fee saved as Draft and routed to Checker');
        return;
      }
      if(module==='VAT / Tax'){
        const name=document.getElementById('taxName').value.trim();
        const rate=document.getElementById('taxRate').value.trim();
        if(!name){toast('Tax name is required');return}
        if(rate===''){toast('Rate % is required');return}
        const from=displayDate(document.getElementById('taxFrom').value);
        const to=document.getElementById('taxNoExpiry').checked?'No expiry':displayDate(document.getElementById('taxTo').value);
        vatRows.unshift([name,Number(rate)+'%',from,to,'Draft']);
        closeOverlay();
        if(currentScreen==='VAT / Tax')renderScreen();
        toast('Tax jurisdiction saved as Draft and routed to Checker');
        return;
      }
      if(module==='FX Rates'){
        const form=document.querySelector('.drawer-body');
        const ccy=form.querySelector('select').value;
        const rate=form.querySelector('input').value.trim();
        if(!rate){toast('Rate Value is required');return}
        const stamp=nowStamp();
        const existing=fxRateList.find(r=>r.ccy===ccy);
        const before=existing?{currency:ccy,rate:existing.rate,source:existing.source,updated:existing.updated}:null;
        if(existing){existing.history.unshift([rate,'Manual',stamp]);existing.rate=rate;existing.source='Manual';existing.updated=stamp}
        else fxRateList.push({ccy,rate,source:'Manual',updated:stamp,history:[[rate,'Manual',stamp]]});
        pushAudit('CREATE','FX Rates','Success','Manual FX rate added for '+ccy+' '+rate,before,{currency:ccy,rate,source:'Manual',updated:stamp});
        closeOverlay();
        if(currentScreen==='FX Rates'){fxTab='rates';renderScreen()}
        toast('Manual FX rate saved and written to the audit log');
        return;
      }
      closeOverlay();
      toast(`${module} saved as Draft and routed to Checker`);
    }

\n  "screen_version": "ATM-EN-1.0",\n  "validity_seconds": 45,\n  "withdrawn": ${q.status==='WITHDRAWN'},\n  "pan_ref": "${q.bin}••••••"\n}</div></div>`)}
    function resolveBreak(id){showModal(`<div class="modal-head"><h2>Resolve ${id}</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="modal-body"><div class="field"><label>Resolution Code <span class="required">*</span></label><select><option>Select resolution</option><option>HOST_CORRECTED</option><option>SCHEME_NOT_RECEIVED</option><option>DISPENSE_CONFIRMED</option><option>FALSE_POSITIVE</option></select></div><div class="field"><label>Resolution note</label><input placeholder="Add investigation note"></div></div><div class="modal-foot"><button class="secondary" onclick="closeOverlay()">Cancel</button><button class="primary" onclick="closeOverlay();toast('Break marked resolved with an audit entry')">Close break</button></div>`)}
    function showModal(html,wide){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="closeOverlay()"><div class="modal${wide?' wide':''}" onclick="event.stopPropagation()">${html}</div></div>`}
    function runReport(name){document.getElementById('reportResult').innerHTML=`<div class="card report-result"><div class="toolbar"><b>${name}</b><span class="spacer"></span><button class="secondary" onclick="toast('Report exported as CSV')">⇩ Export</button><button class="primary" onclick="toast('Weekly schedule created')">◷ Schedule</button></div><div class="subtle-banner" style="margin:15px">Showing 31 Aug 2026 • All currencies • All ATM groups</div><table class="data-table">${tableHead(['Dimension','Count','Amount','Share'])}<tbody><tr><td>SAR / Saudi Riyal</td><td>8,204</td><td>SAR 8,442,100.00</td><td>63.9%</td></tr><tr><td>USD / US Dollar</td><td>3,412</td><td>USD 964,531.20</td><td>26.6%</td></tr><tr><td>EUR / Euro</td><td>1,224</td><td>EUR 112,008.45</td><td>9.5%</td></tr></tbody></table></div>`}
    function pushAudit(action,module,result,summary,before,after){audits.unshift([nowStamp(),currentUser?currentUser.username:'system',action,module,result,summary,before||null,after||null])}
    function auditBody(value){if(value===undefined||value===null)return '{ }';return escHtml(typeof value==='string'?value:JSON.stringify(value,null,2))}
    function openAudit(i){const a=audits[i];showDrawer(`<div class="drawer-head"><h2>Audit Entry</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="drawer-body"><span class="status ${a[4]==='Success'?'green':'red'}">${a[4]} • immutable</span><div class="detail-grid" style="margin-top:18px"><div class="detail-box"><label>Timestamp</label><b>${a[0]}</b></div><div class="detail-box"><label>Actor</label><b>${a[1]}</b></div><div class="detail-box"><label>Action</label><b>${a[2]}</b></div><div class="detail-box"><label>Module</label><b>${a[3]}</b></div></div><p class="tiny muted" style="margin:0 0 12px">${escHtml(a[5]||'')}</p><h4 style="color:var(--navy)">Before value</h4><div class="json">${a.length>6?auditBody(a[6]):'{ "markup_pct": "3.25", "status": "Effective" }'}</div><h4 style="color:var(--navy)">After value</h4><div class="json">${a.length>6?auditBody(a[7]):'{ "markup_pct": "3.50", "status": "Submitted", "maker": "dcc.maker" }'}</div></div>`)}
    function settleApproval(i,btn,status){
      const item=approvals[i];
      if(!item||item.status!=='Pending')return;
      item.status=status;
      if(item.rule)item.rule[item.rule.length-1]=status==='Approved'?'Effective':'Rejected';
      const checker=currentUser?currentUser.username:'dcc.checker';
      pushAudit(status==='Approved'?'APPROVE':'REJECT',item.module,'Success',item.id+' '+(status==='Approved'?'approved':'rejected')+': '+item.change,{status:'Draft',change:item.change},{status:item.rule?item.rule[item.rule.length-1]:status,checker});
      btn.parentElement.parentElement.style.opacity='.45';
      btn.parentElement.innerHTML=`<span class="status ${status==='Approved'?'green':'red'}">${status}</span>`;
      const badge=document.querySelector('.queue-badge');
      if(badge)badge.textContent=approvals.filter(a=>a.status==='Pending').length;
      toast(status==='Approved'?'Change approved, moved to Effective, and written to the audit log':'Change rejected and written to the audit log');
    }
    function approveChange(i,btn){settleApproval(i,btn,'Approved')}
    function rejectChange(i,btn){settleApproval(i,btn,'Rejected')}
    function ackAlert(btn){btn.textContent='Acknowledged';btn.disabled=true;btn.classList.remove('primary');btn.classList.add('secondary');toast('Alert acknowledged and timestamped')}
    function smartNav(v){if(!v){document.getElementById('smartResults')?.remove();return}const hits=permissions[currentUser.role].filter(x=>x.toLowerCase().includes(v.toLowerCase()));let box=document.getElementById('smartResults');if(!box){box=document.createElement('div');box.id='smartResults';box.style='position:fixed;top:58px;right:180px;width:290px;background:#fff;border:1px solid #dce2ea;box-shadow:0 10px 25px rgba(0,0,0,.16);z-index:20;border-radius:3px;overflow:hidden';document.body.appendChild(box)}box.innerHTML=hits.length?hits.map(x=>`<button style="display:block;width:100%;padding:10px 13px;text-align:left;background:#fff;border:0;border-bottom:1px solid #edf0f4;font-size:12px;color:#263449" onclick="document.getElementById('smartResults').remove();navigate('${x}')">${x}</button>`).join(''):'<div style="padding:12px;font-size:12px;color:#728096">No matching screens</div>'}
    function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2900)}
  </script>
</body>
</html>
